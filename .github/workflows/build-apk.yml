name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prepare web app
        run: |
          echo "Repository files:"
          ls -la

          mkdir -p www

          echo "Searching for HTML file..."
          HTML_FILE=$(find . -type f -name "*.html" -not -path "./.git/*" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No HTML file was found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          echo "HTML file found:"
          echo "$HTML_FILE"

          if [ "$HTML_FILE" != "./www/index.html" ]; then
            cp "$HTML_FILE" www/index.html
          fi

          echo "Final web assets:"
          ls -la www

          test -f www/index.html
          echo "index.html is ready."

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "hifz-management-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/core": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF

      - name: Install Capacitor
        run: npm install

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.hifz.management',
            appName: 'إدارة حلقات التحفيظ',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hifz-management-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
