name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Verify web app
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "www directory:"
          ls -la www
          echo "Checking index.html:"
          test -f www/index.html
          echo "index.html found successfully."

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "hifz-management-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/core": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF

      - name: Install Capacitor
        run: npm install

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.hifz.management',
            appName: 'إدارة حلقات التحفيظ',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hifz-management-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
