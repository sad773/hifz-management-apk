name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. إعداد Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      # 3. تجهيز شعار التطبيق
      - name: Prepare app logo
        run: |
          mkdir -p assets

          if [ -f "logo-1.png" ]; then
            cp "logo-1.png" "assets/logo.png"
          else
            echo "ERROR: logo-1.png not found"
            exit 1
          fi

          echo "App logo:"
          ls -lh assets/logo.png

      # 4. تجهيز ملف التطبيق
      - name: Prepare web app
        run: |
          echo "Repository files:"
          ls -la

          mkdir -p www

          echo "Searching for HTML file..."

          HTML_FILE=$(find . -type f -name "*.html" -not -path "./.git/*" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No HTML file was found."
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          echo "HTML file found:"
          echo "$HTML_FILE"

          if [ "$HTML_FILE" != "./www/index.html" ]; then
            cp "$HTML_FILE" www/index.html
          fi

          echo "Final web assets:"
          ls -la www

          test -f www/index.html

          echo "index.html is ready."

      # 5. إنشاء package.json
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "hifz-management-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/core": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0",
              "@capacitor/assets": "^3.0.5",
              "typescript": "^5.9.0"
            }
          }
          EOF

      # 6. تثبيت Capacitor
      - name: Install Capacitor
        run: npm install

      # 7. إنشاء إعدادات Capacitor
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.hifz.management',
            appName: 'إدارة حلقات التحفيظ',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      # 8. إضافة Android
      - name: Add Android platform
        run: npx cap add android

      # 9. إنشاء أيقونة Android من شعار الملتقى
      - name: Generate Android app icon
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor "#ffffff" \
            --iconBackgroundColorDark "#ffffff"

      # 10. مزامنة التطبيق
      - name: Sync web assets
        run: npx cap sync android

      # 11. إعداد Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 12. إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 13. تثبيت حزم Android المطلوبة
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 14. بناء APK
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 15. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hifz-management-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
